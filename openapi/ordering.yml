openapi: 3.0.4

info:
  title: AlgaShop - Ordering
  version: "2.0"

servers:
  - description: Development
    url: "http://localhost:8080"
  - description: Production
    url: "https://api.algashop.com"

paths:
  /api/v1/customers/me:
    post:
      description: >-
        Register the authenticated user as a customer. The customer id is taken
        from the access token subject, never from the request body. Requires
        scope customers:write and the CUSTOMER role.
      tags:
        - My Customer
      security:
        - oauth2: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        201:
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
          headers:
            Location:
              schema:
                type: string
              description: Resource address
              example: "/api/v1/customers/me"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          $ref: "#/components/responses/Conflict"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        500:
          $ref: "#/components/responses/InternalError"
    get:
      description: >-
        Get the authenticated customer's own data. Requires scope
        customers:read and the CUSTOMER role.
      tags:
        - My Customer
      security:
        - oauth2: ["customers:read"]
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
    put:
      description: >-
        Update the authenticated customer's own data. Requires scope
        customers:write and the CUSTOMER role.
      tags:
        - My Customer
      security:
        - oauth2: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateInput"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        500:
          $ref: "#/components/responses/InternalError"

  /api/v1/customers/me/orders:
    post:
      tags:
        - My Orders
      description: >-
        Place an order as the authenticated customer. The customer id comes
        from the access token subject and, on shopping-cart checkouts, the cart
        is resolved from the authenticated customer - neither is accepted in
        the request body. Requires scope orders:write and the CUSTOMER role.
      security:
        - oauth2: ["orders:write"]
      requestBody:
        required: true
        content:
          application/vnd.order-with-shopping-cart.v1+json:
            schema:
              $ref: "#/components/schemas/OrderWithShoppingCartInput"
          application/vnd.order-with-product.v1+json:
            schema:
              $ref: "#/components/schemas/OrderWithProductInput"
      responses:
        201:
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          headers:
            Location:
              schema:
                type: string
              description: Resource address
              example: "/api/v1/customers/me/orders/01226N0693HDE"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          $ref: "#/components/responses/Conflict"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        500:
          $ref: "#/components/responses/InternalError"
    get:
      description: >-
        List orders placed by the authenticated customer. The listing is always
        scoped to the token subject; a customerId query parameter, if sent, is
        ignored. Requires scope orders:read and the CUSTOMER role.
      tags:
        - My Orders
      security:
        - oauth2: ["orders:read"]
      parameters:
        - schema:
            $ref: "#/components/schemas/OrderStatus"
          in: query
          name: status
          required: false
        - schema:
            type: string
            format: date
            example: "2024-04-25"
          in: query
          name: placedAtFrom
          required: false
        - schema:
            type: string
            format: date
            example: "2024-04-01"
          in: query
          name: placedAtTo
          required: false
        - schema:
            type: number
            example: 1211.98
          in: query
          name: totalAmountFrom
          required: false
        - schema:
            type: number
            example: 2341.98
          in: query
          name: totalAmountTo
          required: false
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/direction"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderSummary"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"

  /api/v1/customers/me/orders/{orderId}:
    get:
      tags:
        - My Orders
      description: >-
        Detail of one order belonging to the authenticated customer. An order
        owned by another customer answers 404, never 403, so ids cannot be
        probed. Requires scope orders:read and the CUSTOMER role.
      security:
        - oauth2: ["orders:read"]
      parameters:
        - schema:
            type: string
          required: true
          name: orderId
          in: path
          example: "01226N0693HDG"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/customers/me/shopping-cart:
    get:
      tags:
        - My Shopping Cart
      description: Get the authenticated customer's shopping cart
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingCart"
        404:
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - My Shopping Cart
      description: Create a Shopping Cart for the authenticated customer (if not exists)
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingCart"
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/customers/me/shopping-cart/items:
    get:
      tags:
        - My Shopping Cart
      description: List items in the authenticated customer's shopping cart
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingCartItemList"
        404:
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - My Shopping Cart
      description: Add or update an item in the authenticated customer's shopping cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShoppingCartItemInput"
      responses:
        204:
          description: OK
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - My Shopping Cart
      description: Empty the authenticated customer's shopping cart
      responses:
        204:
          description: OK
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/customers/me/shopping-cart/items/{itemId}:
    delete:
      tags:
        - My Shopping Cart
      description: Remove an item from the authenticated customer's shopping cart
      parameters:
        - schema:
            type: string
          name: itemId
          in: path
          required: true
          example: "28fcd9fb-4ce7-44d6-9583-14d8b3dc5aff"
      responses:
        204:
          description: OK
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/customers:
    get:
      description: >-
        List customers. Administrative: requires scope customers:read and a
        non-CUSTOMER role (back-office users only).
      tags:
        - Customers
      security:
        - oauth2: ["customers:read"]
      parameters:
        - schema:
            type: string
            example: "John Doe"
          in: query
          name: firstName
          required: false
        - schema:
            type: string
            example: "johndoe@email.com"
          in: query
          name: email
          required: false
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/direction"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomerSummary"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"

  /api/v1/customers/{customerId}:
    get:
      description: >-
        Get one customer by id. Administrative: requires scope customers:read
        and a non-CUSTOMER role (back-office users only).
      tags:
        - Customers
      security:
        - oauth2: ["customers:read"]
      parameters:
        - schema:
            type: string
          name: customerId
          in: path
          required: true
          example: "6e148bd5-47f6-4022-b9da-07cfaa294f7a"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/customers/{customerId}/shopping-cart:
    get:
      description: >-
        Read a customer's shopping cart. Administrative, read-only: requires
        scope shopping-carts:read.
      tags:
        - Customers
      security:
        - oauth2: ["shopping-carts:read"]
      parameters:
        - schema:
            type: string
          name: customerId
          in: path
          required: true
          example: "6e148bd5-47f6-4022-b9da-07cfaa294f7a"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingCart"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/orders:
    get:
      description: >-
        List orders of any customer. Administrative: requires scope orders:read
        and a non-CUSTOMER role (back-office users only). Customers list their
        own orders at /api/v1/customers/me/orders.
      tags:
        - Orders
      security:
        - oauth2: ["orders:read"]
      parameters:
        - schema:
            $ref: "#/components/schemas/OrderStatus"
          in: query
          name: status
          required: false
        - schema:
            type: string
            format: date
            example: "2024-04-25"
          in: query
          name: placedAtFrom
          required: false
        - schema:
            type: string
            format: date
            example: "2024-04-01"
          in: query
          name: placedAtTo
          required: false
        - schema:
            type: number
            example: 1211.98
          in: query
          name: totalAmountFrom
          required: false
        - schema:
            type: number
            example: 2341.98
          in: query
          name: totalAmountTo
          required: false
        - schema:
            type: string
            example: "01226N0640J7Q"
          in: query
          name: orderId
          required: false
        - schema:
            type: string
            example: "380d7e70-7942-4b8d-a0e9-b93d79aa6745"
          in: query
          name: customerId
          required: false
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/direction"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderSummary"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"

  /api/v1/orders/{orderId}:
    get:
      tags:
        - Orders
      description: >-
        Order detail of any customer. Administrative: requires scope
        orders:read and a non-CUSTOMER role (back-office users only).
      security:
        - oauth2: ["orders:read"]
      parameters:
        - schema:
            type: string
          required: true
          name: orderId
          in: path
          example: "01226N0693HDG"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"

  /api/v1/shipping-cost-previews:
    post:
      summary: Preview shipping cost
      description: Calculates a preview of the shipping cost and expected delivery date based on the destination zip code.
      tags:
        - Shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingCostPreviewInput"
      responses:
        200:
          description: Shipping cost preview calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingCostPreviewOutput"
        400:
          $ref: "#/components/responses/BadRequest"
        409:
          $ref: "#/components/responses/Conflict"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        500:
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >-
        Access tokens are issued by the AlgaShop Authorization Server.
        Besides the scopes below, some operations also require a specific user
        role carried in the token's "role" claim: /me resources demand the
        CUSTOMER role, while administrative resources demand a non-CUSTOMER
        role (back-office users). Roles cannot be expressed as scopes, so each
        operation states its role requirement in the description.
      flows:
        authorizationCode:
          authorizationUrl: "http://auth.algashop.local:9000/oauth2/authorize"
          tokenUrl: "http://auth.algashop.local:9000/oauth2/token"
          scopes:
            customers:read: Read customer data
            customers:write: Register and update customers
            orders:read: Read orders
            orders:write: Place orders
            shopping-carts:read: Read shopping carts
            shopping-carts:write: Manage shopping carts
            shipping-costs:preview: Preview shipping costs
  parameters:
    page:
      schema:
        type: integer
        example: 0
      name: page
      in: query
      required: false
    size:
      schema:
        type: integer
        example: 5
      name: size
      in: query
      required: false
    sort:
      schema:
        type: string
        example: "firstName"
      name: sortByProperty
      in: query
      required: false
    direction:
      schema:
        type: string
        example: "desc"
      name: sortDirection
      in: query
      required: false
  responses:
    Unauthorized:
      description: Missing, expired or invalid access token
    Forbidden:
      description: Authenticated, but lacking the required scope or role
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Conflict resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  schemas:
    Customer:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - document
        - phone
        - birthDate
        - loyaltyPoints
        - registeredAt
        - archivedAt
        - promotionNotificationsAllowed
        - archived
        - address
      properties:
        id:
          type: string
          example: "380d7e70-7942-4b8d-a0e9-b93d79aa6745"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          example: "johndoe@email.com"
        document:
          type: string
          example: "12345"
        phone:
          type: string
          example: "1191234564"
        birthDate:
          type: string
          format: date
          example: "1991-07-05"
        loyaltyPoints:
          type: number
          example: 10
        registeredAt:
          type: string
          format: date-time
          example: "2024-04-04T00:12:45Z"
        archivedAt:
          type: string
          format: date-time
          example: "2024-04-04T00:12:45Z"
        promotionNotificationsAllowed:
          type: boolean
          example: false
        archived:
          type: boolean
          example: false
        address:
          $ref: "#/components/schemas/Address"
    Address:
      type: object
      required:
        - street
        - number
        - neighborhood
        - city
        - state
        - zipCode
      properties:
        street:
          type: string
          example: "Bourbon Street"
          nullable: false
          x-validation: "notBlank"
        number:
          type: string
          example: "2000"
          nullable: false
          x-validation: "notBlank"
        complement:
          type: string
          example: "apt 122"
          nullable: true
        neighborhood:
          type: string
          example: "North Ville"
          nullable: false
          x-validation: "notBlank"
        city:
          type: string
          example: "Yostfort"
          nullable: false
          x-validation: "notBlank"
        state:
          type: string
          example: "South Carolina"
          nullable: false
          x-validation: "notBlank"
        zipCode:
          type: string
          example: "12321"
          nullable: false
          x-validation: "notBlank"
    CustomerSummary:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - document
        - phone
        - birthDate
        - loyaltyPoints
        - registeredAt
        - archivedAt
        - promotionNotificationsAllowed
        - archived
      properties:
        id:
          type: string
          example: "380d7e70-7942-4b8d-a0e9-b93d79aa6745"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          example: "johndoe@email.com"
        document:
          type: string
          example: "12345"
        phone:
          type: string
          example: "1191234564"
        birthDate:
          type: string
          format: date
          example: "1991-07-05"
        loyaltyPoints:
          type: number
          example: 10
        registeredAt:
          type: string
          format: date-time
          example: "2024-04-04T00:12:45Z"
        archivedAt:
          type: string
          format: date-time
          example: "2024-04-04T00:12:45Z"
        promotionNotificationsAllowed:
          type: boolean
          example: false
        archived:
          type: boolean
          example: false
    CustomerInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - document
        - phone
        - birthDate
        - promotionNotificationsAllowed
        - address
      properties:
        firstName:
          type: string
          example: "John"
          nullable: false
          x-validation: "notBlank"
        lastName:
          type: string
          example: "Doe"
          nullable: false
          x-validation: "notBlank"
        email:
          type: string
          example: "johndoe@email.com"
          nullable: false
          x-validation: ["email", "notBlank"]
        document:
          type: string
          example: "12345"
          nullable: false
          x-validation: "notBlank"
        phone:
          type: string
          example: "1191234564"
          nullable: false
          x-validation: "notBlank"
        birthDate:
          type: string
          format: date
          example: "1991-07-05"
          nullable: false
          x-validation: "pastDate"
        promotionNotificationsAllowed:
          type: boolean
          example: false
          nullable: false
        address:
          $ref: "#/components/schemas/Address"
    CustomerUpdateInput:
      type: object
      required:
        - firstName
        - lastName
        - phone
        - promotionNotificationsAllowed
        - address
      properties:
        firstName:
          type: string
          example: "John"
          nullable: false
          x-validation: "notBlank"
        lastName:
          type: string
          example: "Doe"
          nullable: false
          x-validation: "notBlank"
        phone:
          type: string
          example: "1191234564"
          nullable: false
          x-validation: "notBlank"
        promotionNotificationsAllowed:
          type: boolean
          example: false
          nullable: false
        address:
          $ref: "#/components/schemas/Address"
    ProblemDetail:
      type: object
      required:
        - status
        - type
      properties:
        status:
          type: integer
          example: 400
        type:
          type: string
          example: "/errors/invalid-data"
        title:
          type: string
          example: Invalid fields
        instance:
          type: string
          example: /"api/v1/customers"
        detail:
          type: string
          example: One or more fields are invalid
        fields:
          type: object
          description: Fields that caused the error
    Page:
      type: object
      required:
        - number
        - size
        - totalPages
        - totalElements
        - content
      properties:
        number:
          type: integer
          example: 2
        size:
          type: integer
          example: 9
        totalPages:
          type: integer
          example: 15
        totalElements:
          type: integer
          example: 150
    OrderWithProductInput:
      description: Used by Customer via POST /api/v1/customers/me/orders. The customer is derived from the authentication token.
      required:
        - paymentMethod
        - productId
        - quantity
        - shipping
        - billing
      properties:
        productId:
          type: string
          example: "28fcd9fb-4ce7-44d6-9583-14d8b3dc5aff"
          nullable: false
        quantity:
          type: integer
          example: 12
          nullable: false
          x-validation: "positive"
        paymentMethod:
          type: string
          example: "GATEWAY_BALANCE"
          nullable: false
        creditCardId:
          type: string
          example: "28fcd9fb-4ce7-44d6-9583-14d8b3dc5aff"
          nullable: true
        shipping:
          $ref: "#/components/schemas/ShippingInput"
        billing:
          $ref: "#/components/schemas/Billing"
    OrderWithShoppingCartInput:
