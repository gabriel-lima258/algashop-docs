asyncapi: 3.1.0

info:
  title: AlgaShop - Product Catalog AsyncAPI
  version: "1.0"
  description: >-
    Asynchronous contract of the Product Catalog service. It publishes product
    events, receives stock commands and replies to them.

defaultContentType: application/json

servers:
  development:
    host: "algashop-kafka-1:9092"
    protocol: kafka

channels:
  productEvents:
    address: product-catalog.product.events
    title: Product events
    description: Product lifecycle and price changes published by Product Catalog.
    messages:
      productAdded:
        $ref: "./messages.yml#/components/messages/ProductAddedEvent"
      productListed:
        $ref: "./messages.yml#/components/messages/ProductListedEvent"
      productDelisted:
        $ref: "./messages.yml#/components/messages/ProductDelistedEvent"
      productPriceChanged:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEvent"
      productPriceChangedV2:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEventV2"
      productPlacedOnSale:
        $ref: "./messages.yml#/components/messages/ProductPlacedOnSaleEvent"
      productRestocked:
        $ref: "./messages.yml#/components/messages/ProductRestockedEvent"
      productSoldOut:
        $ref: "./messages.yml#/components/messages/ProductSoldOutEvent"
    bindings:
      kafka:
        topic: product-catalog.product.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  stockCommands:
    address: product-catalog.stock.commands
    title: Stock commands
    description: Stock commands, keyed by the order id.
    messages:
      reserveStock:
        $ref: "./messages.yml#/components/messages/ReserveStockCommand"
    bindings:
      kafka:
        topic: product-catalog.stock.commands
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  stockCommandsDeadLetter:
    address: product-catalog.dlt.product-catalog.stock.commands
    title: Stock commands dead-letter topic
    description: Commands that failed processing or are of unknown type.
    messages:
      reserveStock:
        $ref: "./messages.yml#/components/messages/ReserveStockCommand"
    bindings:
      kafka:
        topic: product-catalog.dlt.product-catalog.stock.commands
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
          retention.ms: 2592000000
        bindingVersion: "0.5.0"

operations:
  publishProductEvents:
    action: send
    channel:
      $ref: "#/channels/productEvents"
    summary: Publishes product lifecycle and price-change events.
    tags:
      - name: Products
    messages:
      - $ref: "#/channels/productEvents/messages/productAdded"
      - $ref: "#/channels/productEvents/messages/productListed"
      - $ref: "#/channels/productEvents/messages/productDelisted"
      - $ref: "#/channels/productEvents/messages/productPriceChanged"
      - $ref: "#/channels/productEvents/messages/productPriceChangedV2"
      - $ref: "#/channels/productEvents/messages/productPlacedOnSale"
      - $ref: "#/channels/productEvents/messages/productRestocked"
      - $ref: "#/channels/productEvents/messages/productSoldOut"

  consumeStockCommands:
    action: receive
    channel:
      $ref: "#/channels/stockCommands"
    summary: Reserves the stock of an order.
    description: A repeated command answers again with the outcome of the existing reservation.
    tags:
      - name: Commands
    messages:
      - $ref: "#/channels/stockCommands/messages/reserveStock"
    reply:
      address:
        description: Reply topic chosen by the sender of the command.
        location: "$message.header#/kafka_replyTopic"
      messages:
        - $ref: "./messages.yml#/components/messages/StockReservationConfirmedReply"
        - $ref: "./messages.yml#/components/messages/StockReservationRejectedReply"
    bindings:
      kafka:
        groupId:
          type: string
          const: product-catalog.stock-commands
        bindingVersion: "0.5.0"

  publishFailedStockCommands:
    action: send
    channel:
      $ref: "#/channels/stockCommandsDeadLetter"
    summary: Moves stock commands that could not be processed to the dead-letter topic.
    tags:
      - name: Dead letter
    messages:
      - $ref: "#/channels/stockCommandsDeadLetter/messages/reserveStock"