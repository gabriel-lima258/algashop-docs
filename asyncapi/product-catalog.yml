asyncapi: 3.1.0

info:
  title: AlgaShop - Product Catalog AsyncAPI
  version: "1.0"

defaultContentType: application/json

servers:
  development:
    host: "algashop-kafka-1:9092"
    protocol: kafka

channels:
  productEvents:
    address: product-catalog.product.events
    title: Product events
    description: Product lifecycle and price changes published by Product Catalog.
    messages:
      productAdded:
        $ref: "./messages.yml#/components/messages/ProductAddedEvent"
      productListed:
        $ref: "./messages.yml#/components/messages/ProductListedEvent"
      productDelisted:
        $ref: "./messages.yml#/components/messages/ProductDelistedEvent"
      productPriceChanged:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEvent"
      productPriceChangedV2:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEventV2"
      productPlacedOnSale:
        $ref: "./messages.yml#/components/messages/ProductPlacedOnSaleEvent"
      productRestocked:
        $ref: "./messages.yml#/components/messages/ProductRestockedEvent"
      productSoldOut:
        $ref: "./messages.yml#/components/messages/ProductSoldOutEvent"
    bindings:
      kafka:
        topic: product-catalog.product.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

operations:
  publishProductEvents:
    action: send
    channel:
      $ref: "#/channels/productEvents"
    summary: Publishes product lifecycle and price-change events.
    tags:
      - name: Products
    messages:
      - $ref: "#/channels/productEvents/messages/productAdded"
      - $ref: "#/channels/productEvents/messages/productListed"
      - $ref: "#/channels/productEvents/messages/productDelisted"
      - $ref: "#/channels/productEvents/messages/productPriceChanged"
      - $ref: "#/channels/productEvents/messages/productPriceChangedV2"
      - $ref: "#/channels/productEvents/messages/productPlacedOnSale"
      - $ref: "#/channels/productEvents/messages/productRestocked"
      - $ref: "#/channels/productEvents/messages/productSoldOut"
