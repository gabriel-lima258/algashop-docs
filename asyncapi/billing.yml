asyncapi: 3.1.0

info:
  title: AlgaShop - Billing AsyncAPI
  version: "1.0"
  description: >-
    Asynchronous contract of the Billing service. It receives commands to issue
    and refund invoices, replies to them, and publishes invoice events.

defaultContentType: application/json

servers:
  development:
    host: "algashop-kafka-1:9092"
    protocol: kafka

channels:
  invoiceEvents:
    address: billing.invoice.events
    title: Invoice events
    description: Invoice lifecycle events published and consumed by Billing.
    messages:
      invoiceIssued:
        $ref: "./messages.yml#/components/messages/InvoiceIssuedEvent"
      invoicePaid:
        $ref: "./messages.yml#/components/messages/InvoicePaidEvent"
      invoiceCanceled:
        $ref: "./messages.yml#/components/messages/InvoiceCanceledEvent"
    bindings:
      kafka:
        topic: billing.invoice.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  invoiceCommands:
    address: billing.invoice.commands
    title: Invoice commands
    description: Commands to issue and refund invoices, keyed by the order id.
    messages:
      issueInvoice:
        $ref: "./messages.yml#/components/messages/IssueInvoiceCommand"
      cancelInvoice:
        $ref: "./messages.yml#/components/messages/CancelInvoiceCommand"
    bindings:
      kafka:
        topic: billing.invoice.commands
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  invoiceCommandsDeadLetter:
    address: billing.dlt.billing.invoice.commands
    title: Invoice commands dead-letter topic
    description: Commands that failed processing or are of unknown type.
    messages:
      issueInvoice:
        $ref: "./messages.yml#/components/messages/IssueInvoiceCommand"
      cancelInvoice:
        $ref: "./messages.yml#/components/messages/CancelInvoiceCommand"
    bindings:
      kafka:
        topic: billing.dlt.billing.invoice.commands
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
          retention.ms: 2592000000
        bindingVersion: "0.5.0"

  invoiceEventsDeadLetter:
    address: billing.dlt.billing.invoice.events
    title: Invoice events dead-letter topic
    description: Invoice events that failed processing.
    messages:
      invoiceIssued:
        $ref: "./messages.yml#/components/messages/InvoiceIssuedEvent"
    bindings:
      kafka:
        topic: billing.dlt.billing.invoice.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
          retention.ms: 2592000000
        bindingVersion: "0.5.0"

operations:
  consumeInvoiceCommands:
    action: receive
    channel:
      $ref: "#/channels/invoiceCommands"
    summary: Issues or refunds the invoice of an order.
    description: >-
      Issue: the invoice is generated.
    tags:
      - name: Commands
    messages:
      - $ref: "#/channels/invoiceCommands/messages/issueInvoice"
      - $ref: "#/channels/invoiceCommands/messages/cancelInvoice"
    reply:
      address:
        description: Reply topic chosen by the sender of the command.
        location: "$message.header#/kafka_replyTopic"
      messages:
        - $ref: "./messages.yml#/components/messages/InvoicePaidReply"
        - $ref: "./messages.yml#/components/messages/InvoiceCanceledReply"
    bindings:
      kafka:
        groupId:
          type: string
          const: billing.invoice-commands
        bindingVersion: "0.5.0"

  publishInvoiceEvents:
    action: send
    channel:
      $ref: "#/channels/invoiceEvents"
    summary: Publishes invoice issuance, payment, and cancellation events.
    tags:
      - name: Invoices
    messages:
      - $ref: "#/channels/invoiceEvents/messages/invoiceIssued"
      - $ref: "#/channels/invoiceEvents/messages/invoicePaid"
      - $ref: "#/channels/invoiceEvents/messages/invoiceCanceled"

  consumeInvoiceIssuedEvents:
    action: receive
    channel:
      $ref: "#/channels/invoiceEvents"
    summary: Processes payment for issued invoices.
    tags:
      - name: Invoices
    messages:
      - $ref: "#/channels/invoiceEvents/messages/invoiceIssued"
    bindings:
      kafka:
        groupId:
          type: string
          const: billing.invoice-events
        bindingVersion: "0.5.0"

  publishFailedInvoiceCommands:
    action: send
    channel:
      $ref: "#/channels/invoiceCommandsDeadLetter"
    summary: Moves failed invoice commands to the Billing dead-letter topic.
    tags:
      - name: Dead letter
    messages:
      - $ref: "#/channels/invoiceCommandsDeadLetter/messages/issueInvoice"
      - $ref: "#/channels/invoiceCommandsDeadLetter/messages/cancelInvoice"

  publishFailedInvoiceEvents:
    action: send
    channel:
      $ref: "#/channels/invoiceEventsDeadLetter"
    summary: Moves failed invoice events to the Billing dead-letter topic.
    tags:
      - name: Dead letter
    messages:
      - $ref: "#/channels/invoiceEventsDeadLetter/messages/invoiceIssued"