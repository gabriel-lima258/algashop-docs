asyncapi: 3.1.0

info:
  title: AlgaShop - Ordering AsyncAPI
  version: "1.0"
  description: >-
    Asynchronous contract of the Ordering service. The service publishes order
    lifecycle events and checkout-processing commands, and consumes product,
    invoice, stock reservation, and checkout command messages.

defaultContentType: application/json

servers:
  development:
    host: "algashop-kafka-1:9092"
    protocol: kafka
    description: >-
      Development Kafka cluster. The other bootstrap brokers are
      algashop-kafka-2:9093 and algashop-kafka-3:9094.

channels:
  productEvents:
    address: product-catalog.product.events
    title: Product events
    description: Product changes consumed by Ordering to update carts and cached products.
    messages:
      productListed:
        $ref: "./messages.yml#/components/messages/ProductListedEvent"
      productDelisted:
        $ref: "./messages.yml#/components/messages/ProductDelistedEvent"
      productRestocked:
        $ref: "./messages.yml#/components/messages/ProductRestockedEvent"
      productSoldOut:
        $ref: "./messages.yml#/components/messages/ProductSoldOutEvent"
      productPriceChangedV2:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEventV2"
    bindings:
      kafka:
        topic: product-catalog.product.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  orderEvents:
    address: ordering.order.events
    title: Order events
    description: Order lifecycle events published by Ordering.
    messages:
      orderPlaced:
        $ref: "./messages.yml#/components/messages/OrderPlacedEvent"
      orderPaid:
        $ref: "./messages.yml#/components/messages/OrderPaidEvent"
      orderReady:
        $ref: "./messages.yml#/components/messages/OrderReadyEvent"
      orderCanceled:
        $ref: "./messages.yml#/components/messages/OrderCanceledEvent"
    bindings:
      kafka:
        topic: ordering.order.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
        bindingVersion: "0.5.0"

  productEventsDeadLetter:
    address: ordering.dlt.product-catalog.product.events
    title: Product events dead-letter topic
    messages:
      productListed:
        $ref: "./messages.yml#/components/messages/ProductListedEvent"
      productDelisted:
        $ref: "./messages.yml#/components/messages/ProductDelistedEvent"
      productRestocked:
        $ref: "./messages.yml#/components/messages/ProductRestockedEvent"
      productSoldOut:
        $ref: "./messages.yml#/components/messages/ProductSoldOutEvent"
      productPriceChangedV2:
        $ref: "./messages.yml#/components/messages/ProductPriceChangedEventV2"
    bindings:
      kafka:
        topic: ordering.dlt.product-catalog.product.events
        partitions: 3
        replicas: 3
        topicConfiguration:
          min.insync.replicas: 2
          retention.ms: 2592000000
        bindingVersion: "0.5.0"

operations:
  consumeProductEvents:
    action: receive
    channel:
      $ref: "#/channels/productEvents"
    summary: Updates shopping carts and product caches from product changes.
    tags:
      - name: Products
    messages:
      - $ref: "#/channels/productEvents/messages/productListed"
      - $ref: "#/channels/productEvents/messages/productDelisted"
      - $ref: "#/channels/productEvents/messages/productRestocked"
      - $ref: "#/channels/productEvents/messages/productSoldOut"
      - $ref: "#/channels/productEvents/messages/productPriceChangedV2"
    bindings:
      kafka:
        groupId:
          type: string
          const: ordering.product-events
        bindingVersion: "0.5.0"

  publishOrderEvents:
    action: send
    channel:
      $ref: "#/channels/orderEvents"
    summary: Publishes order lifecycle changes.
    tags:
      - name: Orders
    messages:
      - $ref: "#/channels/orderEvents/messages/orderPlaced"
      - $ref: "#/channels/orderEvents/messages/orderPaid"
      - $ref: "#/channels/orderEvents/messages/orderReady"
      - $ref: "#/channels/orderEvents/messages/orderCanceled"

  publishFailedProductEvents:
    action: send
    channel:
      $ref: "#/channels/productEventsDeadLetter"
    summary: Moves product events that could not be processed to their dead-letter topic.
    tags:
      - name: Dead letter
